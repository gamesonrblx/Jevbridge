# ~/.codex/config.toml  — or project .codex/config.toml

[mcp_servers.jevbridge]
command = "node"
args = [
  "--experimental-strip-types",
  "/absolute/path/to/Jevbridge/src/cli.ts",
  "mcp",
]

[mcp_servers.jevbridge.env]
TYPESAFE_API_KEY = "ts_..."
JEVBRIDGE_LLM = "openai"
OPENAI_API_KEY = "sk-..."
